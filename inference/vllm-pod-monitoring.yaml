apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: vllm-tpu-podmonitoring
  namespace: default
  labels:
    app: vllm-monitoring
spec:
  selector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - gemma4-vllm-tpu-v5p
      - gemma4-vllm-tpu-v5p-tp2
      - gemma4-31b-vllm-tpu
      - gemma4-vllm-tpu-v6e-4tpu
      - gemma4-vllm-tpu-v6e
  endpoints:
  - port: 8000
    path: /metrics
    interval: 15s
