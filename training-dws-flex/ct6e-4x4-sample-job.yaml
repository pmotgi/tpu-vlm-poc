apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ct6e-4x4-test-job
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
    provreq.kueue.x-k8s.io/maxRunDurationSeconds: "3600"
  labels:
    kueue.x-k8s.io/queue-name: dws-v6e-4x4-local-queue
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    template:
      metadata:
        labels:
          app: ct6e-4x4-test
      spec:
        parallelism: 4
        completions: 4
        backoffLimit: 0
        template:
          metadata:
            labels:
              app: ct6e-4x4-test
              kueue.x-k8s.io/queue-name: dws-v6e-4x4-local-queue
          spec:
            schedulerName: default-scheduler
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-accelerator-count: "4"
              cloud.google.com/gke-tpu-accelerator: ct6e
              cloud.google.com/gke-tpu-topology: 4x4
              cloud.google.com/gke-queued: "true"
            tolerations:
            - key: google.com/tpu
              operator: Exists
              effect: NoSchedule
            - key: cloud.google.com/gke-queued
              operator: Equal
              value: "true"
              effect: NoSchedule
            containers:
            - name: tpu-job
              image: python:3.9-slim
              command:
              - /bin/bash
              - -c
              - |
                echo "Starting ct6e 4x4 TPU test job on ${HOSTNAME}..."
                sleep 60
                echo "Job complete!"
              resources:
                limits:
                  google.com/tpu: 4
                requests:
                  google.com/tpu: 4
