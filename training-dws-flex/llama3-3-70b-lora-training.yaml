apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: llama3-3-70b-lora-training
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
    provreq.kueue.x-k8s.io/maxRunDurationSeconds: '3600'
  labels:
    kueue.x-k8s.io/queue-name: dws-local-queue
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    template:
      metadata:
        labels:
          app: llama3-3-70b-lora-training
      spec:
        parallelism: 2
        completions: 2
        backoffLimit: 0
        template:
          metadata:
            labels:
              app: llama3-3-70b-lora-training
              kueue.x-k8s.io/queue-name: dws-local-queue
            annotations:
              gke-gcsfuse/volumes: 'true'
          spec:
            schedulerName: default-scheduler
            restartPolicy: Never
            securityContext:
              runAsUser: 0
              runAsGroup: 100
              fsGroup: 100
            serviceAccountName: workload-identity-k8s-sa
            automountServiceAccountToken: true
            nodeSelector:
              cloud.google.com/gke-accelerator-count: '4'
              cloud.google.com/gke-nodepool: gke-tpu-7x-pool
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 2x2x2
              cloud.google.com/gke-queued: 'true'
            tolerations:
            - key: google.com/tpu
              operator: Exists
              effect: NoSchedule
            - key: cloud.google.com/gke-queued
              operator: Equal
              value: 'true'
              effect: NoSchedule
            containers:
            - name: lora-trainer
              image: us-east5-docker.pkg.dev/northam-ce-mlai-tpu/pmotgi-vlm-poc-repo/my-maxtext-runner:latest
              securityContext:
                privileged: true
                runAsUser: 0
                runAsGroup: 100
              env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-secret
                    key: hf_api_token
              command:
              - bash
              - -c
              - "set -e\nPOD_INDEX=${JOB_COMPLETION_INDEX:-$(echo \"${HOSTNAME:-$POD_NAME}\"\
                \ | awk -F'-' '{print $NF}')}\necho \"=== [container: lora-trainer]\
                \ Running Pod Index ${POD_INDEX} across 2x2x2 TPU mesh (${HOSTNAME})\
                \ ===\"\n\nexport TPU_STDERR_LOG_LEVEL=0\nexport TPU_MIN_LOG_LEVEL=0\n\
                export TF_CPP_MIN_LOG_LEVEL=0\nexport JAX_PLATFORMS='tpu,cpu'\nexport\
                \ ENABLE_PJRT_COMPATIBILITY='true'\nexport GOOGLE_CLOUD_PROJECT=\"\
                northam-ce-mlai-tpu\"\n\n# -- Model & Checkpoint Paths --\nexport\
                \ MODEL=\"llama3.3-70b\"\nexport MAXTEXT_CKPT_PATH=\"/checkpoint/maxtext/llama3.3-70b/scanned_chkpt/0/items\"\
                \nexport BASE_OUTPUT_DIRECTORY=\"/checkpoint/llama3.3-70b/lora_training\"\
                \nexport RUN_NAME=\"llama3-3-70b-lora-2x2x2-bs16\"\n\n# -- Dataset\
                \ Configuration --\nexport DATASET_NAME=\"openai/gsm8k\"\nexport TRAIN_SPLIT=\"\
                train\"\nexport HF_DATA_DIR=\"main\"\nexport TRAIN_DATA_COLUMNS=\"\
                ['question','answer']\"\n\n# -- LoRA & Hyperparameter Configuration\
                \ --\nexport STEPS=100\nexport PER_DEVICE_BATCH_SIZE=16\nexport MAX_TARGET_LENGTH=1024\n\
                export LEARNING_RATE=3e-6\nexport LORA_RANK=16\nexport LORA_ALPHA=32.0\n\
                \necho \"=== Installing Tunix (Google JAX post-training library required\
                \ for LoRA/SFT) ===\"\npip install --no-cache-dir https://github.com/google/tunix/archive/refs/heads/main.zip\n\
                \necho \"=== Patching Tunix multi-host resharding for non-Pathways\
                \ TPU mesh ===\"\npython3 -c 'import re; p=\"/usr/local/lib/python3.12/site-packages/tunix/rl/reshard.py\"\
                ; c=open(p).read(); new=\"def _get_reshard_fn_jax_device_put(*, donate:\
                \ bool, cache_resharding_plans: bool = False, use_experimental_pre_reshard:\
                \ bool = False):\\n  import functools\\n  @functools.lru_cache(maxsize=1024)\\\
                n  def _get_jitted(in_spec, out_spec):\\n    return jax.jit(lambda\
                \ arr: arr, in_shardings=in_spec, out_shardings=out_spec)\\n  def\
                \ _reshard_leaf(leaf, leaf_sharding):\\n    if not isinstance(leaf,\
                \ jax.Array):\\n      return leaf\\n    if hasattr(leaf, \\\"sharding\\\
                \") and leaf.sharding == leaf_sharding:\\n      return leaf\\n   \
                \ try:\\n      return jax.device_put(leaf, leaf_sharding, donate=donate)\\\
                n    except ValueError:\\n      try:\\n        return jax.make_array_from_callback(leaf.shape,\
                \ leaf_sharding, lambda idx: leaf[idx])\\n      except Exception:\\\
                n        return _get_jitted(leaf.sharding, leaf_sharding)(leaf)\\\
                n  def reshard_fn(x, sharding):\\n    return jax.tree_util.tree_map(_reshard_leaf,\
                \ x, sharding)\\n  return reshard_fn\"; c_patched=re.sub(r\"def _get_reshard_fn_jax_device_put\\\
                (.*?return functools\\.partial\\(\\s*jax\\.device_put,\\s*donate=donate,\\\
                s*\\)\", new, c, flags=re.DOTALL); open(p,\"w\").write(c_patched)'\n\
                \ncd /deps/src || cd / || true\n\nexport MAXTEXT_SFT_CONFIG=\"maxtext/configs/post_train/sft.yml\"\
                \nif [ ! -f \"$MAXTEXT_SFT_CONFIG\" ]; then\n  export MAXTEXT_SFT_CONFIG=\"\
                src/maxtext/configs/post_train/sft.yml\"\nfi\n\nexport TOKENIZER_PATH=\"\
                meta-llama/Llama-3.3-70B-Instruct\"\n\n# Optional: Pass HuggingFace\
                \ Token if set in environment\nHF_TOKEN_ARG=\"\"\nif [ -n \"$HF_TOKEN\"\
                \ ]; then\n  HF_TOKEN_ARG=\"hf_access_token=${HF_TOKEN}\"\nfi\n\n\
                export LIBTPU_INIT_ARGS='--xla_tpu_scoped_vmem_limit_kib=65536 --xla_tpu_impure_enable_packed_bf16_math_ops=true\
                \ --xla_tpu_enable_sparse_core_reduce_scatter_v2=true --xla_tpu_enable_sparse_core_collective_offload_all_gather=true\
                \ --xla_tpu_enable_sparse_core_collective_offload_2d_all_gather=true\
                \ --xla_tpu_enable_all_gather_offload_tracing=true --xla_tpu_use_tc_device_shape_on_sc=True\
                \ --xla_sc_disable_megacore_partitioning=True --xla_tpu_enable_async_collective_fusion_fuse_all_gather=false\
                \ --xla_enable_async_all_gather=true --xla_tpu_prefer_async_allgather_to_allreduce=true\
                \ --xla_tpu_enable_sparse_core_collective_offload_all_reduce=true\
                \ --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=true\
                \ --xla_tpu_enable_sparse_core_collective_offload_3d_all_gather=true\
                \ --xla_tpu_use_single_sparse_core_for_all_gather_offload=true --xla_tpu_enable_concurrent_sparse_core_offloading=true\
                \ --xla_max_concurrent_async_all_gathers=2 --xla_max_concurrent_async_reduce_scatters=2\
                \ --xla_tpu_aggressive_opt_barrier_removal=true --xla_tpu_enable_offloading_gather_to_sparsecore=true\
                \ --xla_tpu_sparse_core_all_gather_latency_multiplier=1 --xla_tpu_sparse_core_reduce_scatter_latency_multiplier=3\
                \ --xla_tpu_enable_sparse_core_collective_aggregator=true --xla_tpu_enable_latency_hiding_layer_scheduler=true\
                \ --xla_tpu_scheduler_percent_shared_memory_limit=150 --xla_tpu_enable_layer_scheduler_for_dependent_collectives=true\
                \ --xla_tpu_enable_sparse_core_collective_offload_nd_reduce_scatter=true\
                \ --xla_tpu_pcie_bandwidth_multiplier=0.03 --xla_tpu_enable_multi_compute_overlap_in_layer_scheduler=true\
                \ '\n\necho \"=== Starting Llama 3.3 70B LoRA Fine-Tuning across 2x2x2\
                \ TPU mesh ===\"\necho \"Base Output Dir: ${BASE_OUTPUT_DIRECTORY}/${RUN_NAME}\"\
                \necho \"Loading Base Parameters from: ${MAXTEXT_CKPT_PATH}\"\n\n\
                export PYTHONUNBUFFERED=1\n\npython3 -u -m maxtext.trainers.post_train.sft.train_sft\
                \ \\\n  \"${MAXTEXT_SFT_CONFIG}\" \\\n  run_name=\"${RUN_NAME}\" \\\
                \n  base_output_directory=\"${BASE_OUTPUT_DIRECTORY}\" \\\n  model_name=\"\
                ${MODEL}\" \\\n  load_parameters_path=\"${MAXTEXT_CKPT_PATH}\" \\\n\
                \  tokenizer_path=\"${TOKENIZER_PATH}\" \\\n  tokenizer_type=huggingface\
                \ \\\n  hf_path=\"${DATASET_NAME}\" \\\n  train_split=\"${TRAIN_SPLIT}\"\
                \ \\\n  hf_data_dir=\"${HF_DATA_DIR}\" \\\n  train_data_columns=\"\
                ${TRAIN_DATA_COLUMNS}\" \\\n  steps=${STEPS} \\\n  per_device_batch_size=${PER_DEVICE_BATCH_SIZE}\
                \ \\\n  max_target_length=${MAX_TARGET_LENGTH} \\\n  learning_rate=${LEARNING_RATE}\
                \ \\\n  dtype=bfloat16 \\\n  weight_dtype=bfloat16 \\\n  enable_tensorboard=False\
                \ \\\n  enable_checkpointing=True \\\n  save_checkpoint_on_completion=True\
                \ \\\n  enable_nnx=True \\\n  pure_nnx_decoder=True \\\n  lora.enable_lora=True\
                \ \\\n  lora.lora_rank=${LORA_RANK} \\\n  lora.lora_alpha=${LORA_ALPHA}\
                \ \\\n  checkpoint_storage_use_zarr3=False \\\n  checkpoint_storage_use_ocdbt=True\
                \ \\\n  enable_single_controller=False\n\necho \"=== Llama 3.3 70B\
                \ LoRA Multi-Host Training Completed Successfully! ===\"\n"
              resources:
                limits:
                  google.com/tpu: '4'
              volumeMounts:
              - mountPath: /dev/shm
                name: dshm
              - mountPath: /checkpoint
                name: gcs-input
            volumes:
            - name: dshm
              emptyDir:
                medium: Memory
            - name: gcs-input
              persistentVolumeClaim:
                claimName: checkpoint-data-cerence-gke-test-tbd-6e9665fd-pvc
