apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: llama3-1-8b-grpo-spot-2x2x1-training
  namespace: default
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
  labels: {}
spec:
  failurePolicy:
    maxRestarts: 0
  replicatedJobs:
  - name: slice
    template:
      metadata:
        labels:
          app: llama3-1-8b-grpo-training
      spec:
        parallelism: 1
        completions: 1
        backoffLimit: 0
        template:
          metadata:
            labels:
              app: llama3-1-8b-grpo-training
            annotations:
              gke-gcsfuse/volumes: 'true'
          spec:
            schedulerName: default-scheduler
            restartPolicy: Never
            securityContext:
              runAsUser: 0
              runAsGroup: 100
              fsGroup: 100
            serviceAccountName: workload-identity-k8s-sa
            automountServiceAccountToken: true
            nodeSelector:
              cloud.google.com/gke-accelerator-count: '4'
              cloud.google.com/gke-nodepool: tpu-v7x-spot-2x2x1
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 2x2x1
              cloud.google.com/gke-spot: 'true'
            tolerations:
            - key: google.com/tpu
              operator: Exists
              effect: NoSchedule
            containers:
            - name: lora-trainer
              image: us-east5-docker.pkg.dev/northam-ce-mlai-tpu/pmotgi-vlm-poc-repo/my-maxtext-runner:grpo-v2
              securityContext:
                privileged: true
                runAsUser: 0
                runAsGroup: 100
              env:
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-secret
                    key: hf_api_token
              - name: VLLM_TARGET_DEVICE
                value: "tpu"
              - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
                value: "python"
              - name: VLLM_NO_USAGE_STATS
                value: "1"
              - name: TF_CPP_MIN_LOG_LEVEL
                value: "2"
              command:
              - python3
              - -m
              - maxtext.trainers.post_train.rl.train_rl
              - maxtext/configs/post_train/rl.yml
              - model_name=llama3.1-8b-Instruct
              - tokenizer_path=meta-llama/Llama-3.1-8B-Instruct
              - run_name=llama3-1-8b-grpo-training-run
              - base_output_directory=/checkpoint/maxtext
              - chips_per_vm=4
              resources:
                limits:
                  google.com/tpu: '4'
              volumeMounts:
              - mountPath: /dev/shm
                name: dshm
              - mountPath: /checkpoint
                name: gcs-input
            volumes:
            - name: dshm
              emptyDir:
                medium: Memory
            - name: gcs-input
              persistentVolumeClaim:
                claimName: checkpoint-data-pmotgi-tpu-v7x-04a179d1-pvc
